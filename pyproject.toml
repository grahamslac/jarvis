[project]
name = "jarvis-local"
version = "0.1.0"
description = "Asistente digital local, seguro y extensible"
requires-python = ">=3.11"
dependencies = ["openai>=1.68.0", "python-dotenv>=1.0.1"]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
